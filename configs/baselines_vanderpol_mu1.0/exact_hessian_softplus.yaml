data:
  raw_dir: data/vanderpol/mu_1.0

closed_loop:
  plant: vanderpol
  plant_kwargs: {mu: 1.0, dt: 0.05}

ccp:
  max_iters: 15

model:
  g: {hidden_width: 8, depth: 2}
  h: {hidden_width: 32, depth: 2}

activation:
  kind: softplus
  swap_to_relu_after_training: true

curvature:
  mode: exact_hessian
  target: both
  lambda_h: 0.0007444441903453081
  sigma: 0.5621655874320041
  n_pairs: 4

training:
  batch_size: 512
  optimizer: adam
  lr: 0.006459367085984857
  warmup_epochs: 2
  patience: 22
  weight_decay: 0.008172222002012158

logging:
  run_name: baseline_vanderpol_mu1.0_exact_hessian_softplus
