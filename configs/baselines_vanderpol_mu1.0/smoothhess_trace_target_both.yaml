data:
  raw_dir: data/vanderpol/mu_1.0

closed_loop:
  plant: vanderpol
  plant_kwargs: {mu: 1.0, dt: 0.05}

ccp:
  max_iters: 15

model:
  g: {hidden_width: 88, depth: 3}
  h: {hidden_width: 104, depth: 1}

curvature:
  mode: smoothhess_trace
  target: both
  lambda_h: 2.902652141826391
  sigma: 0.27038471881202836
  n_pairs: 8

training:
  batch_size: 1024
  optimizer: adam
  lr: 0.004878360603452143
  warmup_epochs: 9
  patience: 5
  weight_decay: 0.005107473025775657

logging:
  run_name: baseline_vanderpol_mu1.0_smoothhess_trace_target_both
