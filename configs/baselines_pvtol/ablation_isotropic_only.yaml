data:
  raw_dir: data/pvtol
  input_column: u1
  output_column: alpha
  target_column: ydd
  target_offset: 0
  n_state_history: 1
  n_control_history: 1
  horizon: 1

closed_loop:
  plant: pvtol
  u_min: -10.0
  u_max: 10.0
  du_max: 1000000.0

ccp:
  max_iters: 15

model:
  g: {hidden_width: 32, depth: 3}
  h: {hidden_width: 104, depth: 2}

curvature:
  mode: smoothhess_trace
  lambda_h: 0.7158728631500193
  sigma: 0.07616907478441684
  n_pairs: 6

training:
  batch_size: 512
  optimizer: adamw
  lr: 0.00019170041589170651
  warmup_epochs: 5
  patience: 28
  weight_decay: 0.0024929222914887497

logging:
  run_name: ablation_pvtol_isotropic_only
