data:
  raw_dir: data/pvtol
  input_column: u1
  output_column: alpha
  target_column: ydd
  target_offset: 0
  n_state_history: 1
  n_control_history: 1
  horizon: 1

closed_loop:
  plant: pvtol
  u_min: -10.0
  u_max: 10.0
  du_max: 1000000.0

ccp:
  max_iters: 15

model:
  g: {hidden_width: 8, depth: 3}
  h: {hidden_width: 96, depth: 3}

curvature:
  mode: tangent_gap
  target: both
  lambda_h: 0.7183758655813989
  sigma: 0.02859532041815463
  n_pairs: 4

training:
  batch_size: 64
  optimizer: adam
  lr: 2.2264204303769678e-05
  warmup_epochs: 3
  patience: 23
  weight_decay: 0.006375574713552132

logging:
  run_name: baseline_pvtol_tangent_gap_target_both
