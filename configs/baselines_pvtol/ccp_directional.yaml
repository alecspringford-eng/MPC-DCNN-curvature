data:
  raw_dir: data/pvtol
  input_column: u1
  output_column: alpha
  target_column: ydd
  target_offset: 0
  n_state_history: 1
  n_control_history: 1
  horizon: 1

closed_loop:
  plant: pvtol
  u_min: -10.0
  u_max: 10.0
  du_max: 1000000.0

ccp:
  max_iters: 15

model:
  g: {hidden_width: 24, depth: 2}
  h: {hidden_width: 32, depth: 2}

curvature:
  mode: ccp_directional
  lambda_h: 0.0007444441903453081
  sigma: 0.12990798006639812
  n_pairs: 4

training:
  batch_size: 512
  optimizer: adam
  lr: 0.006459367085984857
  warmup_epochs: 2
  patience: 22
  weight_decay: 0.008172222002012158

logging:
  run_name: baseline_pvtol_ccp_directional
