[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcnn-curvature"
version = "0.1.0"
description = "Difference-of-convex neural network (f = g - h) for CCP-based MPC, with interchangeable curvature-regularization strategies (SmoothHess, tangent-gap, CCP-directional, exact-Hessian-via-softplus, Jacobian-variation) for side-by-side comparison."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Springford" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "optuna>=3.6",
    "cvxpy>=1.4",
    "cvxpylayers>=0.1.6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
